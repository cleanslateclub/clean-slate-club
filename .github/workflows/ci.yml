name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - backend-os-foundation

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint advisory
        run: npm run lint
        continue-on-error: true

      - name: Typecheck advisory
        run: npm run typecheck
        continue-on-error: true

      - name: Build
        run: npm run build
